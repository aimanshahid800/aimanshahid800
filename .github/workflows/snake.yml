name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"   # daily at midnight UTC
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: aimanshahid800
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff6ec7
            dist/github-snake.svg?color_snake=#c86bff&color_dots=#f1e6ff,#e0c6ff,#c9a6ff,#a86bff,#7f5bff

      - name: Push snake output to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
